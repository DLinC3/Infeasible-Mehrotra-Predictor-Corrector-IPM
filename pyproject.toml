[project]
name = "barrierqp"
version = "0.0.0"
description = "One KKT factorization, two Newton questions."
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax>=0.11.0,<0.12",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.11.0,<0.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
notebook = [
    "ipykernel>=6,<7",
    "nbclient>=0.10,<1",
    "osqp>=1.0,<2",
]

[tool.uv]
package = false
